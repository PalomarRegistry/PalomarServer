name: dependency audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      # Audit the exact lock graph without executing dependency install hooks.
      # This job holds no Cloudflare secret or write permission; its read-only
      # GITHUB_TOKEN is not persisted in the checkout's Git configuration.
      - run: npm run audit:dependencies
