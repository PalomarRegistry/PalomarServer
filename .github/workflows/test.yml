name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build:preflight
      # The Worker imports no npm package at runtime, but Wrangler's development
      # and deploy graph still handles source and production credentials.
      # Keep low-or-higher advisories in that complete dev graph a hard gate.
      - run: npm run audit:dependencies
      # ESLint covers the shipped Worker/browser modules and both test layers.
      # It is a static correctness gate; the tests below remain separate.
      - run: npm run lint
      - run: npm test
      - name: Preserve every previously accepted dashboard schema
        if: github.event_name == 'pull_request'
        run: node tools/check-dashboard-backward-compatibility.js "$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      # Exercise both deployed Workers in workerd after the fast pure and
      # route-contract suite. Deployment depends on this job, so neither Worker
      # is promoted after only passing Node import tests.
      - run: npm run test:runtime
      # These snapshots now reject queued repairs at the Worker boundary, so
      # they must stay byte-semantically aligned with the verifier's profile.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: PalomarRegistry/PalomarSubmission
          ref: main
          path: upstream-submission
          persist-credentials: false
      - run: node tools/check-formalization-contract.mjs upstream-submission

  # This job holds the credential that can deploy the Worker, and an action
  # resolved from a tag runs before the steps that carry it. Pinned by commit,
  # like every other workflow in the registry.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: npm ci
      # Version commands do not apply workers.dev or preview-URL settings.
      # Update only the script's subdomain policy before minting a new version;
      # the deploy token deliberately has no zone-route mutation authority.
      - name: Apply Cloudflare hostname policy
        run: |
          node --input-type=module <<'NODE'
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          const apiToken = process.env.CLOUDFLARE_API_TOKEN;
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${accountId}/workers/scripts/palomar-server/subdomain`,
            {
              method: "POST",
              headers: {
                Authorization: `Bearer ${apiToken}`,
                "Content-Type": "application/json",
                "Cloudflare-Workers-Script-Api-Date": "2025-08-01",
              },
              body: JSON.stringify({ enabled: false, previews_enabled: false }),
            },
          );
          const payload = await response.json();
          if (
            !response.ok ||
            payload.success !== true ||
            payload.result?.enabled !== false ||
            payload.result?.previews_enabled !== false
          ) {
            throw new Error(`Cloudflare refused the hostname policy (${response.status})`);
          }
          NODE
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build browser preflight
        run: npm run build:preflight
      - name: Upload Cloudflare version
        run: npx wrangler versions upload --tag "$GITHUB_SHA" --message "GitHub $GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Promote Cloudflare version
        run: npx wrangler versions deploy --version-tag "$GITHUB_SHA" --yes --message "GitHub $GITHUB_SHA"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
